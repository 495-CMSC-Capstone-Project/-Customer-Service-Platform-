name: Backend Database Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_service_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/customer_service_test"
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend

      - name: Run backend tests
        run: python -m pytest backend/tests -q